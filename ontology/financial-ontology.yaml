# 금융 온톨로지 정의
# 이 파일은 DB 가 비었을 때의 첫 버전과, 서버 코드가 소유하는 부분(reviewStatuses, changeActions, changeFields, claimRelationships, Claim 타입)의 원본이다.
# 그 밖의 부분은 첫 버전을 만든 뒤 ADMIN 이 웹에서 고친다. docs/data-schema.md 의 「온톨로지 버전」.
# schemaVersion 은 저장할 때 서버가 버전 번호로 바꾼다.
#
# 표시 이름(화면에 보이는 말)은 모두 이 파일이 소유한다. 웹 코드에는 타입, 속성, 선택지 이름을 적지 않는다.
# - label: 화면에 보일 이름. 없으면 화면은 키를 그대로 보인다.
# - valueLabels: enum 속성의 선택지 표시 이름. 키는 values 에 있는 값이어야 한다. 저장되는 값은 바뀌지 않는다.
# - description: 입력칸 바로 아래에 보이는 도움말. 개발 용어 없이 쓴다.
# - valueAliases: enum 속성의 예전 표기. API 가 시작할 때 목록 밖 값을 이 표를 보고 고친다. docs/data-schema.md 의 「예전 값 정리」.
# - hintProperties: 검색 결과와 고르기 후보에서 이름 옆에 함께 보일 속성.
# - display: 그래프와 배지의 색(#rrggbb)과 모양(cytoscape 도형 이름).
# - searchProperties: 이름과 함께 검색어에 넣을 속성.
# - createPicker: 끝(to) 타입 만들기 폼에 시작(from) 노드를 고르는 칸을 더한다.
# YAML 흐름 표기({ ... }) 안에서는 쉼표와 콜론이 값을 끊는다. 쉼표나 콜론이 든 문장은 반드시 따옴표로 감싼다.
# API 는 알 수 없는 키가 있으면 시작을 멈춘다. 쉼표로 잘린 값이나 오타를 시작할 때 잡기 위해서다.

schemaVersion: "2.0.0"

nodeTypes:
  Company:
    label: 기업
    description: 사업을 하는 법인이다. 상장 여부와 관계없이 담는다.
    labelProperty: name
    hintProperties: [country]
    display: { color: "#2563eb", shape: ellipse }
    properties:
      name: { type: string, label: 기업 이름, required: true, maxLength: 200, description: "기업의 공식 이름. 예: 삼성전자" }
      country:
        type: enum
        label: 국가
        required: false
        values: [KR, US, JP, CN, TW, HK, NL, DE, GB, FR, OTHER]
        valueLabels:
          KR: 대한민국 (KR)
          US: 미국 (US)
          JP: 일본 (JP)
          CN: 중국 (CN)
          TW: 대만 (TW)
          HK: 홍콩 (HK)
          NL: 네덜란드 (NL)
          DE: 독일 (DE)
          GB: 영국 (GB)
          FR: 프랑스 (FR)
          OTHER: 기타
        valueAliases:
          KR: [한국, 대한민국, 남한, KOR, Korea, South Korea]
          US: [미국, USA, United States]
          JP: [일본, JPN, Japan]
          CN: [중국, CHN, China]
          TW: [대만, TWN, Taiwan]
          HK: [홍콩, HKG, Hong Kong]
          NL: [네덜란드, NLD, Netherlands]
          DE: [독일, DEU, Germany]
          GB: [영국, GBR, UK, United Kingdom]
          FR: [프랑스, FRA, France]
        description: 기업이 등록된 나라
      registrationNumber: { type: string, label: 법인등록번호, required: false, maxLength: 64, description: 기업을 구분하는 공적 번호. 모르면 비워 둔다 }
      description: { type: text, label: 메모, required: false, maxLength: 4000, description: 기업에 대해 남겨 둘 메모 }

  Security:
    label: 종목
    description: 시장에서 거래되는 종목이다. 같은 기업의 여러 상장과 이름이 같은 종목을 시장과 종목 코드로 구분한다.
    labelProperty: name
    hintProperties: [market, ticker]
    display: { color: "#0d9488", shape: ellipse }
    properties:
      market:
        type: enum
        label: 상장 시장
        required: true
        values: [KRX_KOSPI, KRX_KOSDAQ, NASDAQ, NYSE, OTHER]
        valueLabels: { KRX_KOSPI: 코스피, KRX_KOSDAQ: 코스닥, NASDAQ: 나스닥, NYSE: 뉴욕증권거래소, OTHER: 기타 }
        description: 종목이 거래되는 시장
      ticker: { type: string, label: 종목 코드, required: true, maxLength: 32, description: "시장 안에서 쓰는 종목 코드. 예: 005930" }
      name: { type: string, label: 종목 이름, required: true, maxLength: 200, description: "종목의 이름. 예: 삼성전자 보통주" }
      securityType:
        type: enum
        label: 종목 종류
        required: false
        values: [COMMON, PREFERRED, ETF, ADR, OTHER]
        valueLabels: { COMMON: 보통주, PREFERRED: 우선주, ETF: ETF, ADR: 예탁증서(ADR), OTHER: 기타 }
        description: 주식의 종류
      currency:
        type: enum
        label: 거래 통화
        required: false
        values: [KRW, USD, JPY, CNY, TWD, HKD, EUR, GBP]
        valueLabels:
          KRW: 원 (KRW)
          USD: 미국 달러 (USD)
          JPY: 엔 (JPY)
          CNY: 위안 (CNY)
          TWD: 대만 달러 (TWD)
          HKD: 홍콩 달러 (HKD)
          EUR: 유로 (EUR)
          GBP: 파운드 (GBP)
        valueAliases:
          KRW: [원, 원화, "₩", 한국 원]
          USD: [달러, 미국 달러, 미화, "$", "US$"]
          JPY: [엔, 엔화, "¥"]
          CNY: [위안, 위안화, RMB]
          TWD: [대만 달러, "NT$"]
          HKD: [홍콩 달러, "HK$"]
          EUR: [유로, "€"]
          GBP: [파운드, "£"]
        description: 종목이 거래되는 통화

  Sector:
    label: 산업
    description: 기업이 속하고 병목이 생기는 산업이다.
    labelProperty: name
    hintProperties: [scheme, code]
    display: { color: "#9333ea", shape: hexagon }
    properties:
      name: { type: string, label: 산업 이름, required: true, maxLength: 200, description: "산업의 이름. 예: 반도체" }
      scheme: { type: string, label: 분류 체계, required: false, maxLength: 64, description: "산업을 나눈 기준의 이름. 예: GICS, KSIC" }
      code: { type: string, label: 분류 코드, required: false, maxLength: 32, description: 분류 체계 안에서 쓰는 코드 }

  Document:
    label: 근거 문서
    description: 판단과 주장의 근거가 되는 자료다. 서버가 주소를 읽어 오지 않으므로 사람이 자료 정보를 직접 등록한다.
    labelProperty: title
    hintProperties: [publisher, publishedAt]
    display: { color: "#d97706", shape: round-rectangle }
    properties:
      title: { type: string, label: 제목, required: true, maxLength: 300, description: 자료의 제목 }
      url: { type: url, label: 주소, required: true, maxLength: 2000, description: "자료 주소. https:// 를 빼고 적으면 저장할 때 붙인다" }
      publisher: { type: string, label: 발행처, required: false, maxLength: 200, description: "자료를 낸 곳. 예: 금융감독원, 한국경제" }
      documentType:
        type: enum
        label: 자료 종류
        required: false
        values: [FILING, NEWS, REPORT, IR, BOOK, LETTER, SPEECH, OTHER]
        valueLabels: { FILING: 공시, NEWS: 뉴스, REPORT: 보고서, IR: IR 자료, BOOK: 책, LETTER: 서한, SPEECH: 강연과 인터뷰, OTHER: 기타 }
        description: 자료의 성격
      publishedAt: { type: date, label: 공개일, required: false, description: 자료가 공개된 날. 모르면 비워 둔다 }
      collectedAt: { type: datetime, label: 수집 시각, required: true, description: 이 자료를 확인한 시각 }

  Person:
    label: 인물
    description: 투자자, 경영자, 경제학자 같은 인물이다.
    labelProperty: name
    hintProperties: [role, country]
    searchProperties: [englishName]
    display: { color: "#db2777", shape: round-tag }
    properties:
      name: { type: string, label: 이름, required: true, maxLength: 200, description: "인물의 이름. 예: 워런 버핏" }
      englishName: { type: string, label: 영문 이름, required: false, maxLength: 200, description: "영문 이름. 검색에 쓴다. 예: Warren Buffett" }
      role:
        type: enum
        label: 구분
        required: false
        values: [INVESTOR, EXECUTIVE, ECONOMIST, OTHER]
        valueLabels: { INVESTOR: 투자자, EXECUTIVE: 경영자, ECONOMIST: 경제학자, OTHER: 기타 }
        description: 인물이 주로 한 일
      country:
        type: enum
        label: 국가
        required: false
        values: [KR, US, JP, CN, TW, HK, NL, DE, GB, FR, OTHER]
        valueLabels:
          KR: 대한민국 (KR)
          US: 미국 (US)
          JP: 일본 (JP)
          CN: 중국 (CN)
          TW: 대만 (TW)
          HK: 홍콩 (HK)
          NL: 네덜란드 (NL)
          DE: 독일 (DE)
          GB: 영국 (GB)
          FR: 프랑스 (FR)
          OTHER: 기타
        description: 주로 활동한 나라
      birthYear: { type: integer, label: 태어난 해, required: false, min: 1000, max: 2100, description: "태어난 해. 예: 1930" }
      deathYear: { type: integer, label: 세상을 떠난 해, required: false, min: 1000, max: 2100, description: 살아 있으면 비워 둔다 }
      description: { type: text, label: 소개, required: false, maxLength: 4000, description: 인물을 소개하는 글 }

  Concept:
    label: 개념
    description: 안전마진, 경제적 해자 같은 투자 개념과 원칙이다.
    labelProperty: name
    hintProperties: [category]
    searchProperties: [englishName]
    display: { color: "#475569", shape: round-pentagon }
    properties:
      name: { type: string, label: 개념 이름, required: true, maxLength: 200, description: "개념의 이름. 예: 안전마진" }
      englishName: { type: string, label: 영문 이름, required: false, maxLength: 200, description: "영문 이름. 검색에 쓴다. 예: Margin of Safety" }
      category:
        type: enum
        label: 분류
        required: false
        values: [VALUATION, BUSINESS, RISK, BEHAVIOR, STRATEGY, OTHER]
        valueLabels: { VALUATION: 가치 평가, BUSINESS: 사업의 질, RISK: 위험 관리, BEHAVIOR: 투자 심리, STRATEGY: 투자 방식, OTHER: 기타 }
        description: 개념이 다루는 영역
      summary: { type: string, label: 한 줄 정의, required: true, maxLength: 300, description: 개념을 한 문장으로 정의한다 }
      description: { type: text, label: 설명, required: false, maxLength: 4000, description: 더 자세한 설명 }

  Change:
    label: 세상의 변화
    description: 투자 판단에 영향을 주는 세상의 변화다.
    labelProperty: title
    hintProperties: [category]
    display: { color: "#0891b2", shape: round-pentagon }
    properties:
      title: { type: string, label: 변화, required: true, maxLength: 300, description: "변화를 한 문장으로 적는다. 예: AI 서버가 늘면서 고성능 메모리 수요가 커진다" }
      category:
        type: enum
        label: 분류
        required: true
        values: [TECHNOLOGY, DEMOGRAPHIC, SOCIOCULTURAL, OTHER]
        valueLabels: { TECHNOLOGY: 기술, DEMOGRAPHIC: 인구, SOCIOCULTURAL: 사회와 문화, OTHER: 기타 }
      since: { type: string, label: 언제부터, required: false, maxLength: 64, description: "예: 2023년부터. 모르면 비워 둔다" }
      durability: { type: text, label: 오래 가는 이유, required: false, maxLength: 4000 }
      description: { type: text, label: 메모, required: false, maxLength: 4000 }

  Bottleneck:
    label: 병목
    description: 수요를 공급이 따라가지 못하는 구간이다.
    labelProperty: title
    hintProperties: [status]
    display: { color: "#dc2626", shape: hexagon }
    properties:
      title: { type: string, label: 병목, required: true, maxLength: 300, description: "수요를 공급이 따라가지 못하는 구간. 예: HBM 생산과 고적층 패키징" }
      status:
        type: enum
        label: 상태
        required: true
        values: [HYPOTHESIS, CONFIRMED, RESOLVED]
        valueLabels: { HYPOTHESIS: 가설, CONFIRMED: 확인, RESOLVED: 해소 }
      demandEvidence: { type: text, label: 수요 근거, required: false, maxLength: 4000 }
      supplyConstraint: { type: text, label: 공급 제약, required: false, maxLength: 4000 }
      resolutionPath: { type: text, label: 해소 경로, required: false, maxLength: 4000, description: "증설, 대체 기술처럼 병목이 풀릴 길" }
      expectedResolution: { type: string, label: 예상 해소 시점, required: false, maxLength: 64, description: "예: 2027년 하반기. 모르면 비워 둔다" }
      description: { type: text, label: 메모, required: false, maxLength: 4000 }

  Valuation:
    label: 밸류에이션
    description: 한 기업의 가치를 한 기준일에 평가한 기록이다.
    labelProperty: title
    hintProperties: [asOf, method]
    display: { color: "#16a34a", shape: round-rectangle }
    properties:
      title: { type: string, label: 이름, required: true, maxLength: 200, description: "예: FLNC 2026-09-14" }
      asOf: { type: date, label: 기준일, required: false, description: "평가한 날. 모르면 비워 둔다" }
      currentPrice: { type: number, label: 현재가, required: true, min: 0, description: 기준일의 주가 }
      currency:
        type: enum
        label: 통화
        required: false
        values: [KRW, USD, JPY, CNY, TWD, HKD, EUR, GBP]
        valueLabels: { KRW: 원 (KRW), USD: 미국 달러 (USD), JPY: 엔 (JPY), CNY: 위안 (CNY), TWD: 대만 달러 (TWD), HKD: 홍콩 달러 (HKD), EUR: 유로 (EUR), GBP: 파운드 (GBP) }
      method:
        type: enum
        label: 방법
        required: false
        values: [PER, PBR, EV_SALES, EV_EBITDA, DCF, REVERSE_DCF, OTHER]
        valueLabels: { PER: PER, PBR: PBR, EV_SALES: EV/매출, EV_EBITDA: EV/EBITDA, DCF: DCF, REVERSE_DCF: 역DCF, OTHER: 기타 }
      description: { type: text, label: 메모, required: false, maxLength: 4000 }

  Scenario:
    label: 시나리오
    description: 비관, 기준, 낙관 가운데 한 가정으로 계산한 주당 가치다.
    labelProperty: title
    hintProperties: [kind, valuePerShare]
    display: { color: "#65a30d", shape: round-tag }
    properties:
      title: { type: string, label: 이름, required: true, maxLength: 200, description: "예: FLNC 비관" }
      kind:
        type: enum
        label: 종류
        required: true
        values: [BEAR, BASE, BULL]
        valueLabels: { BEAR: 비관, BASE: 기준, BULL: 낙관 }
      valuePerShare: { type: number, label: 주당 가치, required: true, min: 0, description: "밸류에이션과 같은 통화. 범위로 받았으면 중간값을 넣고 범위는 메모에 적는다" }
      assumptions: { type: text, label: 핵심 가정, required: false, maxLength: 4000 }
      description: { type: text, label: 메모, required: false, maxLength: 4000 }

  Decision:
    label: 투자 결정
    description: 종목에 대해 내린 투자 행동의 기록이다.
    labelProperty: title
    hintProperties: [action, decidedAt]
    display: { color: "#7c3aed", shape: round-diamond }
    properties:
      title: { type: string, label: 이름, required: true, maxLength: 200, description: "예: FLNC 첫 매수" }
      action:
        type: enum
        label: 행동
        required: true
        values: [WATCH, BUY, ADD, TRIM, EXIT, HOLD]
        valueLabels: { WATCH: 관심 등록, BUY: 매수, ADD: 추가 매수, TRIM: 일부 매도, EXIT: 전량 매도, HOLD: 보류 }
      decidedAt: { type: date, label: 결정일, required: false, description: "모르면 비워 둔다" }
      reason: { type: text, label: 이유, required: false, maxLength: 4000 }

  Claim:
    label: 주장
    description: 근거 문서와 함께 등록하고 다른 편집자가 검토하는 주장이다.
    labelProperty: predicate
    managedBy: claims
    display: { color: "#dc2626", shape: round-diamond }
    properties:
      predicate: { type: enum, label: 관계 종류, required: true, values: [BELONGS_TO_SECTOR, ADVOCATES, CRITICIZES], description: 주장이 말하는 관계의 종류 }
      description: { type: text, label: 설명, required: true, maxLength: 4000, description: 주장을 한두 문장으로 풀어 쓴 글 }
      evidenceText: { type: text, label: 근거 문장, required: true, maxLength: 4000, description: 근거 문서에서 그대로 옮긴 문장 }
      validFrom: { type: date, label: 시작일, required: false, description: 관계가 시작된 날. 모르면 비워 두고 미상으로 표시한다 }
      validTo: { type: date, label: 종료일, required: false, description: 관계가 끝난 날. 모르면 비워 두고 미상으로 표시한다 }
      authoringMethod:
        type: enum
        label: 작성 방식
        required: true
        values: [MANUAL, AI]
        valueLabels: { MANUAL: 직접 작성, AI: AI 추출 }
        description: 사람이 직접 썼는지 AI 가 뽑았는지
      extractionConfidence: { type: number, label: 확신도, required: false, min: 0, max: 1, description: AI 가 뽑은 내용이 맞을 가능성을 0 에서 1 사이로 적는다. 투자 성공 확률이 아니다 }

relationshipTypes:
  ISSUES:
    label: 발행한다
    sentence: "{from}이(가) {to}을(를) 발행한다"
    description: 기업이 종목을 발행한다. 근거가 필요 없는 식별 관계다.
    from: [Company]
    to: [Security]
    createPicker: { label: 발행 기업, description: "이 종목을 발행한 기업. 고르면 종목을 만든 뒤 발행 관계를 함께 만든다. 몰라도 비워 둘 수 있다" }
  AUTHORED:
    label: 썼다
    sentence: "{from}이(가) {to}을(를) 썼다"
