# 가치투자 온톨로지 컨테이너 이미지를 GHCR 에 올린다.
# GitHub-hosted runner 에서 Buildx 로 linux/amd64 이미지를 빌드한다.
# 공개 저장소이므로 홈서버 runner 를 쓰지 않는다(사용자 결정: 2026-10-24).
# 이미지 이름, 태그(latest, sha-<7자리>), OCI label 과 provenance 설정을 아래에 명시한다.
# 수동 실행(workflow_dispatch)만 둔다. action 은 commit SHA 로 고정한다.
name: workbench-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: workbench-image
  cancel-in-progress: false

jobs:
  build:
    # 이미지는 main 의 코드로만 올린다. 다른 ref 에서 수동 실행하면 job 을 건너뛴다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 이미지 태그 준비
        id: image
        run: echo "sha-tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Buildx 준비
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR 로그인
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드와 push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/jon890/fos-valuation-ontology:latest
            ghcr.io/jon890/fos-valuation-ontology:${{ steps.image.outputs.sha-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
