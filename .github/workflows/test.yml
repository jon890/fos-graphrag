# PR 과 main 에서 서버, 웹 단위, 화면 테스트와 스크립트 검사를 돌린다.
# 모든 테스트가 Docker 없이 돌므로 GitHub-hosted runner 에서 돈다(ADR-018).
# job 이름(api, web, scripts)이 GitHub 의 체크 이름이 된다. action 은 commit SHA 로 고정한다.
name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Temurin 21 준비
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: 서버 테스트
        run: cd api && ./gradlew test --rerun

      # 서버 테스트가 다시 쓴 응답 스냅샷이 커밋한 것과 같아야 한다. git diff 는 untracked 파일을 놓친다
      - name: 응답 스냅샷 확인
        run: |
          if [ -n "$(git status --porcelain -- web/e2e/fixtures)" ]; then
            echo "응답 스냅샷이 커밋한 것과 다르다. api 에서 테스트를 돌리고 web/e2e/fixtures 를 함께 커밋한다"
            git status -- web/e2e/fixtures
            git diff --stat -- web/e2e/fixtures
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 24 준비
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: 웹 테스트와 화면 테스트
        run: |
          cd web
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium --project=mobile

      - name: 실패 결과 올리기
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 24 준비
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: 스크립트 검사
        run: bash scripts/tests/test_scripts.sh
