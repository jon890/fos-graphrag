  - ref: sc-flnc-valley-bull
    type: Scenario
    properties: { title: "FLNC 낙관 (Valley)", kind: BULL, valuePerShare: 266.27, assumptions: "매출총이익률 15%. 공급망이 안정되고 제조원가가 내려가며 서비스와 디지털 비중이 빠르게 커진다. 구조조정 뒤 영업 레버리지가 생긴다." }
