# 운영 Compose. Neo4j 는 호스트 포트를 열지 않고 app 만 내부 네트워크로 접근한다.
name: fos-workbench

services:
  neo4j:
    image: neo4j:5.26.30-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Copy .env.example to .env and set NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1536m
    restart: unless-stopped

  app:
    build: .
    image: fos-workbench-app:local
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Copy .env.example to .env and set NEO4J_PASSWORD}"
      WORKBENCH_SECURE_COOKIE: "${WORKBENCH_SECURE_COOKIE:-false}"
    ports:
      - "${WORKBENCH_BIND:-127.0.0.1}:${WORKBENCH_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
