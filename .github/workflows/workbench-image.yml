# 금융 온톨로지 워크벤치 컨테이너 이미지를 GHCR 에 올린다.
# 홈서버 self-hosted runner(label: homeserver)에서만 돈다. GitHub-hosted runner 는 쓰지 않는다.
# 이미지 이름, 태그(latest, sha-<7자리>), label 은 runner 의 homeserver-image-build 가 정한다.
# 수동 실행(workflow_dispatch)만 둔다. action 은 commit SHA 로 고정한다.
name: workbench-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: workbench-image
  cancel-in-progress: false

jobs:
  build:
    # 이미지는 main 의 코드로만 올린다. 다른 ref 에서 수동 실행하면 job 을 건너뛴다
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, homeserver]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 이미지 빌드와 push
        run: homeserver-image-build financial-workbench
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
