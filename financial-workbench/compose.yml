# 운영 Compose. TLS 를 끝내는 reverse proxy 뒤에서 loopback 포트로 받는다.
# Neo4j 는 호스트 포트를 열지 않고 app 만 내부 네트워크로 접근한다. docker.sock 은 어디에도 마운트하지 않는다.
name: fos-workbench

services:
  neo4j:
    # 5.26 LTS Community. 태그가 다시 가리켜도 바뀌지 않게 digest 로 고정한다(2026-10-20 pull 로 확인)
    image: neo4j:5.26.30-community@sha256:3388e05ee53c8313d01acdf33e63ad175af95a92226dc8551160564439ce2c8c
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Copy .env.example to .env and set NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_SIZE:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_SIZE:-512m}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE_SIZE:-512m}"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: "${WORKBENCH_NEO4J_MEM_LIMIT:-1536m}"
    # 기본 10초 안에 끝나지 않으면 강제 종료되어 트랜잭션 로그가 남고, 오프라인 dump 가 거부된다
    stop_grace_period: 2m
    # 시작 스크립트가 /data 소유자를 맞추고 neo4j 사용자로 바꾸는 데 필요한 것만 되살린다.
    # KILL 이 없으면 tini 가 neo4j 사용자 프로세스에 SIGTERM 을 넘기지 못해 깨끗한 종료가 안 되고 dump 가 거부된다
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  app:
    build: .
    image: "${WORKBENCH_IMAGE:-fos-workbench-app:local}"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Copy .env.example to .env and set NEO4J_PASSWORD}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      WORKBENCH_BOOTSTRAP_ADMIN_EMAIL: "${WORKBENCH_BOOTSTRAP_ADMIN_EMAIL:-}"
      WORKBENCH_SECURE_COOKIE: "${WORKBENCH_SECURE_COOKIE:-true}"
      WORKBENCH_FORWARD_HEADERS_STRATEGY: "${WORKBENCH_FORWARD_HEADERS_STRATEGY:-native}"
      WORKBENCH_SESSION_TIMEOUT: "${WORKBENCH_SESSION_TIMEOUT:-8h}"
      WORKBENCH_HSTS: "${WORKBENCH_HSTS:-false}"
    ports:
      - "${WORKBENCH_BIND:-127.0.0.1}:${WORKBENCH_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: "${WORKBENCH_API_MEM_LIMIT:-768m}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
